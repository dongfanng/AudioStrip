<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>" />
  <title>AudioStrip - 视频音频提取</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #818cf8;
      --success: #22c55e;
      --danger: #ef4444;
      --radius: 12px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      -webkit-tap-highlight-color: transparent;
    }
    .container {
      width: 100%;
      max-width: 480px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px 20px;
    }
    h1 {
      font-size: 22px;
      text-align: center;
      margin-bottom: 6px;
    }
    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 24px;
    }
    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 32px 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .drop-zone:active {
      border-color: var(--primary);
      background: rgba(99, 102, 241, 0.08);
    }
    .drop-zone-icon {
      font-size: 36px;
      margin-bottom: 8px;
    }
    .drop-zone-text {
      color: var(--muted);
      font-size: 14px;
    }
    .drop-zone-hint {
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
    }
    #fileInput { display: none; }
    .file-info {
      display: none;
      align-items: center;
      gap: 10px;
      background: var(--bg);
      border-radius: 8px;
      padding: 12px;
      margin-top: 16px;
    }
    .file-info.show { display: flex; }
    .file-info-name {
      flex: 1;
      font-size: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .file-info-size {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .format-row {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }
    .format-btn {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .format-btn.active {
      border-color: var(--primary);
      color: var(--primary);
      background: rgba(99, 102, 241, 0.1);
    }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: var(--radius);
      background: var(--primary);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 16px;
    }
    .btn:active { background: var(--primary-hover); }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-download {
      background: var(--success);
      display: none;
    }
    .btn-download.show { display: block; }
    .progress-wrap {
      display: none;
      margin-top: 16px;
    }
    .progress-wrap.show { display: block; }
    .progress-bar {
      height: 8px;
      background: var(--bg);
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--primary);
      width: 0%;
      border-radius: 4px;
      transition: width 0.3s;
    }
    .progress-text {
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      margin-top: 8px;
    }
    .status {
      text-align: center;
      font-size: 13px;
      margin-top: 12px;
      min-height: 18px;
    }
    .status.error { color: var(--danger); }
    .status.success { color: var(--success); }
    .footer {
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>AudioStrip</h1>
      <p class="subtitle">从视频中提取音频，文件本地处理，不上传服务器</p>

      <div class="drop-zone" id="dropZone">
        <div class="drop-zone-icon">📁</div>
        <div class="drop-zone-text">点击选择视频文件</div>
        <div class="drop-zone-hint">支持 MP4 / WebM / MKV / MOV 等格式</div>
      </div>
      <input type="file" id="fileInput" accept="video/*" />

      <div class="file-info" id="fileInfo">
        <span class="file-info-name" id="fileName"></span>
        <span class="file-info-size" id="fileSize"></span>
      </div>

      <div class="format-row">
        <button class="format-btn active" data-format="mp3">MP3</button>
        <button class="format-btn" data-format="wav">WAV</button>
        <button class="format-btn" data-format="aac">AAC</button>
      </div>

      <div class="progress-wrap" id="progressWrap">
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-text" id="progressText">准备中...</div>
      </div>

      <div class="status" id="status"></div>

      <button class="btn" id="extractBtn" disabled>提取音频</button>
      <button class="btn btn-download" id="downloadBtn">下载音频</button>

      <div class="footer">所有处理在浏览器本地完成 · 隐私安全</div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
